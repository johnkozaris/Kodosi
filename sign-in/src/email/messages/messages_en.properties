# The words of the e-mails. {0}, {1} and {2} are values. Keycloak reads each line as a message
# format, a line with no value too, so an apostrophe is written two times.
emailVerificationSubject=Confirm your email
kdsVerifyText=Confirm that this address is yours. It is the email of your {0} account.
kdsVerifyAction=Confirm
kdsVerifyNote=The link works for {0}. If you did not make an account, do nothing.

passwordResetSubject=Choose a new password
kdsResetText=This link lets you choose a new password for your {0} account.
kdsResetAction=Choose a password
kdsResetNote=The link works for {0}. If you did not ask for it, do nothing: your password stays as it is.

executeActionsSubject=Finish your account
kdsSetupText=To use your {0} account, do this first: {1}.
kdsSetupPlainText=This link opens the steps that your {0} account needs.
kdsSetupAction=Start
kdsSetupNote=The link works for {0}. If you did not expect this, do nothing.

emailUpdateConfirmationSubject=Confirm your new email
kdsNewEmailText=Your {0} account gets this email: {1}.
kdsNewEmailAction=Confirm
kdsNewEmailNote=The link works for {0}. If you did not ask for this, do nothing: your email stays as it is.

identityProviderLinkSubject=Link your account to {0}
kdsLinkTitle=Link your accounts?
kdsLinkText=Someone wants to link your {1} account to the {0} account of {2}. After that, a sign-in with {0} opens your {1} account.
kdsLinkPlainText=Someone wants to link your {1} account to a {0} account. After that, a sign-in with {0} opens your {1} account.
kdsLinkAction=Link them
kdsLinkNote=The link works for {0}. If this was not you, do nothing.

emailTestSubject=This is a test
kdsTestText=The email of {0} works.

eventLoginErrorSubject=A sign-in did not work
kdsLoginErrorText=A sign-in to your account failed on {0}, from {1}.
eventUpdatePasswordSubject=Your password changed
kdsUpdatePasswordText=Your password changed on {0}, from {1}.
eventUpdateTotpSubject=Your authenticator app changed
kdsUpdateTotpText=The authenticator app of your account changed on {0}, from {1}.
eventRemoveTotpSubject=An authenticator app is removed
kdsRemoveTotpText=An authenticator app was removed from your account on {0}, from {1}.
eventUpdateCredentialSubject=A way of sign-in changed
kdsUpdateCredentialText=A way of sign-in ({0}) changed on {1}, from {2}.
eventRemoveCredentialSubject=A way of sign-in is removed
kdsRemoveCredentialText=A way of sign-in ({0}) was removed from your account on {1}, from {2}.
eventUserDisabledByTemporaryLockoutSubject=Your account is locked for a short time
kdsTemporaryLockoutText=Too many sign-ins failed on {0}. You can sign in again after a short time.
eventUserDisabledByPermanentLockoutSubject=Your account is locked
kdsPermanentLockoutText=Too many sign-ins failed on {0}. Your account stays locked until the people who run this service unlock it.
kdsEventNote=If this was you, do nothing. If it was not you, choose a new password.
kdsLockoutNote=If this was not you, choose a new password when you can sign in again.
kdsUpdateWayText=A way of sign-in changed on {0}, from {1}.
kdsRemoveWayText=A way of sign-in was removed from your account on {0}, from {1}.
# The kinds of a way of sign-in, as Keycloak names them, in the words of a person.
kdsWay.password=password
kdsWay.otp=authenticator app
kdsWay.webauthn=security key
kdsWay.webauthn-passwordless=passkey
kdsWay.recovery-authn-codes=recovery codes

# The steps that Keycloak asks of a person, as the end of the sentence "do this first:".
# kdsAnd is between two steps.
kdsAnd=,
requiredAction.UPDATE_PASSWORD=choose a password
requiredAction.CONFIGURE_TOTP=set up an authenticator app
requiredAction.UPDATE_PROFILE=check your details
requiredAction.VERIFY_PROFILE=check your details
requiredAction.VERIFY_EMAIL=confirm your email
requiredAction.TERMS_AND_CONDITIONS=accept the terms
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=keep your recovery codes
requiredAction.webauthn-register-passwordless=make a passkey
requiredAction.webauthn-register=add a security key
requiredAction.UPDATE_EMAIL=change your email
