<!doctype html>

    <title>Kodosi</title>
    <!-- The K of the mark, and the letters of what a person types. The stylesheet names both.
         The browser starts on the two files with the page, and does not wait for the stylesheet. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/mark.webp" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"
    />
    <script>
      // The language of the page, for a screen reader. Keycloak gives it. With no Keycloak, the
      // development server has it in the address.
      try {
        var given = window.kcContext;
        var tag = given
          ? given.locale && (given.locale.currentLanguageTag || given.locale)
          : new URLSearchParams(location.search).get("lang");
        if (tag && typeof tag === "string") document.documentElement.lang = tag;
      } catch (e) {}
      // The first page of a visit draws the mark. A step that carries on keeps it as it is
      // (src/frame/carry.ts has the same numbers). A page that loads while the mark is still
      // drawn goes on with the drawing from where it was: Keycloak can send a person through
      // two pages in less than a second.
      try {
        var root = document.documentElement;
        var before = JSON.parse(sessionStorage.getItem("kodosi.carry") || "null");
        var since = Date.now() - Number(sessionStorage.getItem("kodosi.arrive") || 0);
        if (since < 900) {
          root.classList.add("arrive");
          root.style.setProperty("--arrived", since / 1000 + "s");
        } else if (!(before && Date.now() - before.t < 6000)) {
          root.classList.add("arrive");
          sessionStorage.setItem("kodosi.arrive", Date.now());
        }
      } catch (e) {}
    </script>
  </head>

         the copper cursor at rest, with the size that it has on the banner; src/frame/cursor.ts
         gives it its life. -->

        />
        <rect id="cursor-home" class="logo-cursor" x="3542" y="-758" width="484" height="790" rx="46" />
      </svg>
    </div>
    <div id="root"></div>
    <script>
      // What the page before this one handed over stays in place until this page draws its own
      // (src/frame/carry.ts): its capsule, and the cursor where it stood. A step of the sign-in
      // never shows an empty page, and the cursor never starts again from nothing.
      try {
        var c = JSON.parse(sessionStorage.getItem("kodosi.carry") || "null");
        if (
          c &&
          Date.now() - c.t < 6000 &&
          c.vw === innerWidth &&
          !matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          if (c.w > 0) {
            var g = document.createElement("div");
            g.id = "carry";
            g.setAttribute("aria-hidden", "true");
            g.className = "sheet-lift";
            g.style.cssText =
              "position:absolute;z-index:1;left:" + c.x + "px;top:" + c.y + "px;width:" + c.w +
              "px;height:" + c.h + "px;border-radius:" + c.r + "px";
            document.body.appendChild(g);
          }
          if (c.cw > 0) {
            var k = document.createElement("div");
            k.id = "cursor";
            k.setAttribute("aria-hidden", "true");
            k.style.cssText =
              "width:" + c.cw + "px;height:" + c.ch + "px;border-radius:" +
              Math.max(1, c.cw * 0.1) + "px;transform:translate(" + c.cx + "px," + c.cy + "px)";
            document.body.appendChild(k);
            document.documentElement.classList.add("cursor-live");
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
