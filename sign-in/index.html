<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/icon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/src/assets/icon-128.png" />
    <link rel="apple-touch-icon" href="/src/assets/icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f0e9dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110e0c" media="(prefers-color-scheme: dark)" />
    <title>Kodosi</title>
    <style>
      html {
        background: #f0e9dc;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #110e0c;
        }
      }
      :where(.logo) {
        display: none;
      }
    </style>
    <link rel="preload" as="image" type="image/webp" href="/src/assets/wordmark.webp" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"
    />
    <script>
      try {
        var given = window.kcContext;
        var tag = given && given.locale && (given.locale.currentLanguageTag || given.locale);
        if (tag && typeof tag === "string") document.documentElement.lang = tag;
      } catch (e) {}
      try {
        var root = document.documentElement;
        var before = JSON.parse(sessionStorage.getItem("%CARRY_KEY%") || "null");
        var since = Date.now() - Number(sessionStorage.getItem("kodosi.arrive") || 0);
        if (since < 900) {
          root.classList.add("arrive");
          root.style.setProperty("--arrived", since / 1000 + "s");
        } else if (!(before && Date.now() - before.t < Number("%CARRY_FRESH_MS%"))) {
          root.classList.add("arrive");
          sessionStorage.setItem("kodosi.arrive", Date.now());
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="logo" class="logo" role="img" aria-label="Kodosi">
      <span class="logo-mark"><span class="logo-word"></span></span>
      <span id="cursor-home" class="logo-cursor"></span>
    </div>
    <div id="root"></div>
    <script>
      try {
        var c = JSON.parse(sessionStorage.getItem("%CARRY_KEY%") || "null");
        if (
          c &&
          Date.now() - c.t < Number("%CARRY_FRESH_MS%") &&
          c.vw === innerWidth &&
          !matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          if (c.w > 0) {
            var g = document.createElement("div");
            g.id = "carry";
            g.setAttribute("aria-hidden", "true");
            g.className = "sheet-lift";
            g.style.cssText =
              "position:absolute;z-index:1;left:" + c.x + "px;top:" + c.y + "px;width:" + c.w +
              "px;height:" + c.h + "px;border-radius:" + c.r + "px";
            document.body.appendChild(g);
          }
          if (c.cw > 0) {
            var k = document.createElement("div");
            k.id = "cursor";
            k.setAttribute("aria-hidden", "true");
            k.style.cssText =
              "width:" + c.cw + "px;height:" + c.ch + "px;border-radius:" +
              Math.max(1, c.cw * 0.1) + "px;transform:translate(" + c.cx + "px," + c.cy + "px)";
            document.body.appendChild(k);
            document.documentElement.classList.add("cursor-live");
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
