[package]
name = "kodosi-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
directories = { version = "6.0.0", default-features = false }
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["fs", "process", "system", "termios"] }
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.1"
zbus = "5.19.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
test-programs = []

[lints]
workspace = true
