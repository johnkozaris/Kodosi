[package]
name = "kodosi-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kodosi-os = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
libc = "0.2.191"
nix = { workspace = true, features = ["process", "signal", "term"] }
rustix = { workspace = true, features = ["fs", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
kodosi-os = { workspace = true, features = ["test-programs"] }
tempfile = { workspace = true }

[lints]
workspace = true
