[workspace]
members = ["crates/ghostty-vt", "crates/ghostty-vt-sys", "crates/kodosi-ffi-c", "crates/kodosi-pty"]
resolver = "3"

[workspace.lints.rust]
dead_code = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_safety_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "allow"
unwrap_used = "warn"
redundant_pub_crate = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"

[workspace.dependencies]
aws-lc-rs = "1.18.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", features = ["serde"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustix = "1.1.4"
serde = "1.0.229"
serde_json = "1.0.151"
specta = "=2.0.0-rc.25"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "0.3.55"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
zeroize = "1.9.0"

[package]
autobins = false
edition = "2024"
name = "kodosi-runtime"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:crossterm"]

[dependencies]
ghostty-vt = { path = "crates/ghostty-vt" }
kodosi-pty = { path = "crates/kodosi-pty" }
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.0"
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
specta-macros = { version = "=2.0.0-rc.25", features = ["serde"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
directories = { version = "6.0.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.ffi-debug]
inherits = "dev"
incremental = false
split-debuginfo = "packed"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
debug = false
opt-level = 1

[[bin]]
name = "kodosi"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "protocol-gen"
path = "src/protocol_gen.rs"
