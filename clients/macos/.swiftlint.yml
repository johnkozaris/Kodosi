excluded:
  - Frameworks
  - KodosiDesktop.xcodeproj
  - .build

identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]
  excluded:
    - id

line_length:
  warning: 160
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 120

disabled_rules:
  - todo
  - opening_brace
  - trailing_comma
  - colon

custom_rules:
  ghostty_import_boundary:
    name: "Ghostty import boundary"
    regex: '^[ \t]*(?:(?:@testable|@_exported|@_implementationOnly|@preconcurrency|public|internal|package|private|fileprivate)[ \t]+)*import[ \t]+GhosttyTerminal\b'
    message: "Ghostty types stay behind KodosiTerminal: import GhosttyTerminal only inside Packages/KodosiTerminal."
    severity: error
    excluded: ".*/Packages/KodosiTerminal/.*"
