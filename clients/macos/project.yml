name: KodosiDesktop

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  deploymentTarget:
    macOS: "${KODOSI_MACOS_DEPLOYMENT_TARGET}"

configs:
  Debug: debug
  Release: release
  WorkingTreeValidation: release

packages:
  KodosiApple:
    path: ../apple

aggregateTargets:
  RuntimeLibrary:
    buildScripts:
      - name: Build Runtime Library
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/../apple/scripts/build-runtime-library.sh" "$PLATFORM_NAME" "$CONFIGURATION" "$BUILT_PRODUCTS_DIR"

settingGroups:
  appBase:
    MARKETING_VERSION: "${KODOSI_VERSION}"
    CURRENT_PROJECT_VERSION: "${KODOSI_VERSION}"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C5886CWK32
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "${KODOSI_MACOS_DEPLOYMENT_TARGET}"
    SUPPORTED_PLATFORMS: macosx
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  KodosiDesktop:
    type: application
    platform: macOS
    deploymentTarget: "${KODOSI_MACOS_DEPLOYMENT_TARGET}"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      WorkingTreeValidation: Config/WorkingTreeValidation.xcconfig
    settings:
      groups:
        - appBase
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodosi.desktop
        PRODUCT_NAME: KodosiDesktop
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KodosiDesktop.entitlements
        KODOSI_PROVISIONING_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: $(KODOSI_PROVISIONING_PROFILE)
        OTHER_LDFLAGS:
          - -lkodosi_runtime
          - -framework Security
          - -framework SystemConfiguration
          - -lresolv
        LD_GENERATE_MAP_FILE: YES
        LD_MAP_FILE_PATH: $(DERIVED_FILE_DIR)/KodosiDesktop-$(CONFIGURATION).linkmap
        ENABLE_DEBUG_DYLIB: NO
        CLANG_ENABLE_MODULES: YES
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: RuntimeLibrary
        link: false
        embed: false
      - package: KodosiApple
        product: KodosiKit
      - package: KodosiApple
        product: KodosiBridge
      - package: KodosiApple
        product: KodosiDesign
      - package: KodosiApple
        product: KodosiTerminal
      - package: KodosiApple
        product: KodosiTerminalSessions
    preBuildScripts:
      - name: Enforce Build Variant
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/scripts/build/enforce-build-variant.sh"
    postBuildScripts:
      - name: Install Notices
        basedOnDependencyAnalysis: false
        script: |
          python3 "$PROJECT_DIR/../apple/scripts/install-notices.py" "$PLATFORM_NAME" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
      - name: Verify Final Ghostty Image
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/../apple/scripts/verify-final-ghostty-image.sh" "$PLATFORM_NAME" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$LD_MAP_FILE_PATH"

  KodosiDesktopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "${KODOSI_MACOS_DEPLOYMENT_TARGET}"
    settings:
      groups:
        - appBase
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodosi.desktop.tests
        PRODUCT_NAME: KodosiDesktopTests
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: KodosiDesktop

schemes:
  KodosiDesktop:
    build:
      targets:
        KodosiDesktop: all
        KodosiDesktopTests: [test]
    run:
      config: Debug
    test:
      gatherCoverageData: false
      environmentVariables:
        - variable: KODOSI_DATA_ROOT
          value: __KODOSI_XCTEST_TMPDIR__
          isEnabled: true
      targets:
        - KodosiDesktopTests
    profile:
      config: Release
    archive:
      config: Release

  WorkingTreeValidation:
    build:
      targets:
        KodosiDesktop: all
    run:
      config: WorkingTreeValidation
    profile:
      config: WorkingTreeValidation
    archive:
      config: WorkingTreeValidation
