name: KodosiMobile

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  deploymentTarget:
    iOS: "${KODOSI_IOS_DEPLOYMENT_TARGET}"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ../apple/Config/Apps.xcconfig
  Release: ../apple/Config/Apps.xcconfig

packages:
  KodosiApple:
    path: ../apple

aggregateTargets:
  RuntimeLibrary:
    buildScripts:
      - name: Build Runtime Library
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/../apple/scripts/build-runtime-library.sh" "$PLATFORM_NAME" "$CONFIGURATION" "$BUILT_PRODUCTS_DIR"

settingGroups:
  appBase:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C5886CWK32
    IPHONEOS_DEPLOYMENT_TARGET: "${KODOSI_IOS_DEPLOYMENT_TARGET}"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ARCHS: arm64
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  KodosiMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      groups:
        - appBase
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodosi.mobile
        PRODUCT_NAME: Kodosi
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/KodosiMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        OTHER_LDFLAGS:
          - -lkodosi_runtime
          - -framework Security
          - -framework CoreFoundation
          - -liconv
          - -lc++
        ENABLE_DEBUG_DYLIB: NO
    sources:
      - path: Sources
      - path: Resources
    postBuildScripts:
      - name: Install Notices
        basedOnDependencyAnalysis: false
        script: |
          python3 "$PROJECT_DIR/../apple/scripts/install-notices.py" "$PLATFORM_NAME" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    dependencies:
      - target: RuntimeLibrary
        link: false
        embed: false
      - package: KodosiApple
        product: KodosiKit
      - package: KodosiApple
        product: KodosiBridge
      - package: KodosiApple
        product: KodosiDesign
      - package: KodosiApple
        product: KodosiTerminal
      - package: KodosiApple
        product: KodosiTerminalSessions

  KodosiMobileTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      groups:
        - appBase
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodosi.mobile.tests
        PRODUCT_NAME: KodosiMobileTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kodosi.app/Kodosi
        BUNDLE_LOADER: $(TEST_HOST)
    sources:
      - path: Tests
    dependencies:
      - target: KodosiMobile

schemes:
  KodosiMobile:
    build:
      targets:
        KodosiMobile: all
        KodosiMobileTests: [test]
    run:
      config: Debug
    test:
      gatherCoverageData: false
      targets:
        - KodosiMobileTests
    profile:
      config: Release
    archive:
      config: Release
