name: Bug report
description: Something in Kodosi does not work as you expect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove private terminal content, names, hosts, paths and credentials first. Report vulnerabilities [in private](https://github.com/johnkozaris/Kodosi/security/advisories/new).
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Mac app
        - Linux app
        - Windows app
        - iPhone and iPad app
        - Command line (kodosi)
        - Backend or self-hosting
        - Sign-in pages
        - Documentation
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and revision
      placeholder: macOS 26.4, Apple silicon, abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: Steps, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Related lines of `app.log` or `host.log`, with private data removed.
      render: text
