name: Proposal
description: A change or a new capability for Kodosi.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has it, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What a person or an agent sees and does.
    validations:
      required: true
