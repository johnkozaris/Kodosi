name: Windows Ghostty library

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/windows-env.sh
      - terminal/ghostty/Patches/ghostty/**
      - terminal/ghostty/Toolchain.env
      - terminal/ghostty/VERSION
      - terminal/ghostty/WindowsGhostty.ref
      - terminal/ghostty/WindowsVtBuild.env
      - terminal/ghostty/Vendor/GhosttyVt/linux-x86_64/include/**
      - terminal/ghostty/Vendor/GhosttyVt/windows-*/**
      - terminal/ghostty/Vendor/GhosttyVt/windows-*.version
      - terminal/ghostty/scripts/apply-patches.sh
      - terminal/ghostty/scripts/build.sh
      - terminal/ghostty/scripts/build-windows-vt-artifact.sh
      - terminal/ghostty/scripts/digest.py
      - terminal/ghostty/scripts/install-zig.sh
      - terminal/ghostty/scripts/prepare-zig-store.sh
      - .github/workflows/ghostty-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the x64 library from the committed patches
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/kodosi-tools"
          mkdir -p "$tools"
          # The runner's Git Bash has python, not python3.
          cat > "$tools/python3" <<'EOF'
          #!/bin/sh
          exec python "$@"
          EOF
          if ! command -v unzip >/dev/null; then
              cat > "$tools/unzip" <<'EOF'
          #!/bin/sh
          [ "$1" = -q ] && shift
          exec python -m zipfile -e "$1" "$3"
          EOF
          fi
          chmod +x "$tools"/*
          PATH="$tools:$PATH" terminal/ghostty/scripts/build.sh
      - name: Check that the committed library has the inputs of this build
        run: |
          # Zig does not always lay out its code the same way, so the library can
          # differ by a few bytes. Its build inputs and its C interface cannot.
          vendor=terminal/ghostty/Vendor/GhosttyVt
          git diff --exit-code --stat -- "$vendor/windows-x86_64/include"
          diff <(git show "HEAD:$vendor/windows-x86_64.version" | grep -v '^vt_archive_sha256=') \
              <(grep -v '^vt_archive_sha256=' "$vendor/windows-x86_64.version")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ghostty-vt-windows-x86_64
          path: |
            terminal/ghostty/Vendor/GhosttyVt/windows-x86_64
            terminal/ghostty/Vendor/GhosttyVt/windows-x86_64.version
          if-no-files-found: error
