name: Windows app

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,uv
          fallback: none
      - name: Install Rust and NASM
        run: |
          rustup toolchain install
          choco install nasm --version=3.2.0 --no-progress --yes
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - id: qt-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: qt-tools-windows-${{ hashFiles('clients/qt/dependencies.lock.json') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime -> ../clients/qt/build/windows-dev/runtime-library/cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: agent-browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: agent-browser-windows-${{ hashFiles('AgentBrowser.lock', 'rust-toolchain.toml', 'scripts/build-agent-browser.py') }}
      - run: just windows-check
      - if: ${{ github.ref == 'refs/heads/main' && steps.qt-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: ${{ steps.qt-tools.outputs.cache-primary-key }}
      - if: ${{ github.ref == 'refs/heads/main' && steps.agent-browser.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: ${{ steps.agent-browser.outputs.cache-primary-key }}
