name: Windows app

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clients/qt/**
      - protocol/desktop-runtime.json
      - runtime/crates/**
      - runtime/Cargo.toml
      - runtime/Cargo.lock
      - terminal/conpty/**
      - terminal/ghostty/Vendor/GhosttyVt/windows-x86_64/**
      - Ghostty.lock
      - VERSION
      - justfile
      - rust-toolchain.toml
      - AgentBrowser.lock
      - scripts/build-agent-browser.py
      - scripts/build-document-views.py
      - scripts/build-runtime-library.py
      - scripts/windows-env.sh
      - .github/workflows/windows.yml
      - "!**/*.md"
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust, NASM and python3
        run: |
          rustup toolchain install
          choco install nasm --no-progress --yes
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
          # The runner's Git Bash has python, not python3.
          tools="$(cygpath -u "$RUNNER_TEMP")/kodosi-tools"
          mkdir -p "$tools"
          printf '#!/bin/sh\nexec python "$@"\n' > "$tools/python3"
          chmod +x "$tools/python3"
          cygpath -w "$tools" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: qt-tools-windows-${{ hashFiles('clients/qt/dependencies.lock.json') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime -> ../clients/qt/build/windows-dev/runtime-library/cargo
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: agent-browser-windows-${{ hashFiles('AgentBrowser.lock', 'rust-toolchain.toml') }}
      - run: just windows-check
