name: Linux app

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room on the disk while the next steps run
        run: sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - name: Install the system libraries
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libglib2.0-dev dbus libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0 \
            libnss3 libasound2t64 libgbm1 libxcb-dri3-0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libwayland-dev libxext-dev
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,uv
          fallback: none
      - run: rustup toolchain install
      - id: qt-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: qt-tools-${{ hashFiles('clients/qt/dependencies.lock.json') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime -> ../clients/qt/build/dev/runtime-library/x86_64-unknown-linux-gnu/dev/cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: agent-browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: agent-browser-linux-${{ hashFiles('AgentBrowser.lock', 'rust-toolchain.toml', 'scripts/build-agent-browser.py') }}
      - run: just linux-check
      - run: just release-test
      - if: ${{ github.ref == 'refs/heads/main' && steps.qt-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: ${{ steps.qt-tools.outputs.cache-primary-key }}
      - if: ${{ github.ref == 'refs/heads/main' && steps.agent-browser.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: ${{ steps.agent-browser.outputs.cache-primary-key }}
