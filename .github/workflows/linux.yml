name: Linux app

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - clients/qt/**
      - protocol/**
      - runtime/crates/**
      - runtime/Cargo.toml
      - runtime/Cargo.lock
      - terminal/ghostty/Vendor/GhosttyVt/linux-x86_64/**
      - Ghostty.lock
      - VERSION
      - justfile
      - rust-toolchain.toml
      - AgentBrowser.lock
      - scripts/build-agent-browser.py
      - scripts/build-document-views.py
      - scripts/build-runtime-library.py
      - scripts/generate-engine-feed.py
      - scripts/generate-update-site.py
      - scripts/tests/**
      - .github/workflows/linux.yml
      - "!**/*.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room on the disk while the next steps run
        run: sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libglib2.0-dev dbus libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0 \
            libnss3 libasound2t64 libgbm1 libxcb-dri3-0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/qt/.tools
          key: qt-tools-${{ hashFiles('clients/qt/dependencies.lock.json') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime -> ../clients/qt/build/dev/runtime-library/x86_64-unknown-linux-gnu/dev/cargo
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/agent-browser
          key: agent-browser-linux-${{ hashFiles('AgentBrowser.lock', 'rust-toolchain.toml') }}
      - run: just linux-check
      - run: just release-test
