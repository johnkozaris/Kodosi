name: Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - runtime/**
      - protocol/**
      - terminal/ghostty/**
      - Ghostty.lock
      - rust-toolchain.toml
      - deny.toml
      - justfile
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just,cargo-deny@0.19.0,cargo-machete@0.9.1
      - name: Put the check tools where the recipes find them
        run: |
          rustup toolchain install
          mkdir -p .tools/rust/bin
          ln -s "$(command -v cargo-deny)" "$(command -v cargo-machete)" .tools/rust/bin/
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime
      - run: just ghostty-check rust-format-check rust-lint rust-dependency-check protocol-check rust-test
