name: Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - runtime/**
      - documents/**
      - browser/**
      - protocol/**
      - terminal/ghostty/**
      - Ghostty.lock
      - rust-toolchain.toml
      - deny.toml
      - justfile
      - VERSION
      - clients/apple/Sources/KodosiKit/kodosi_runtime.h
      - clients/apple/Sources/KodosiBridge/RuntimeHandle.swift
      - clients/qt/src/runtime/RuntimeBridge.hpp
      - clients/android/app/src/main/java/com/kodosi/mobile/runtime/NativeRuntime.kt
      - clients/qt/packaging/licenses/**
      - clients/qt/scripts/release/generate-rust-license-inventory.py
      - README.md
      - docs/GETTING_STARTED.md
      - docs/ARCHITECTURE.md
      - .github/workflows/rust.yml
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - id: versions
        run: echo "tools=cargo-deny@$(just --evaluate cargo_deny_version),cargo-machete@$(just --evaluate cargo_machete_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.versions.outputs.tools }}
      - name: Put the check tools where the recipes find them
        run: |
          rustup toolchain install
          mkdir -p .tools/rust/bin
          ln -s "$(command -v cargo-deny)" "$(command -v cargo-machete)" .tools/rust/bin/
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime
      - run: just ghostty-check rust-format-check rust-lint rust-dependency-check rust-test translations-check
