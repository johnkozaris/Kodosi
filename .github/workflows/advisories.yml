name: Advisories

on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - browser/engine/Cargo.lock
      - runtime/Cargo.lock
      - documents/views/bun.lock
      - sign-in/bun.lock
      - deny.toml
      - .github/workflows/advisories.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just
          fallback: none
      - id: versions
        run: echo "tool=cargo-deny@$(just --evaluate cargo_deny_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ steps.versions.outputs.tool }}
          fallback: none
      - name: Put the check tool where the recipe finds it
        run: |
          mkdir -p .tools/rust/bin
          ln -s "$(command -v cargo-deny)" .tools/rust/bin/
      - run: just rust-advisories-check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() }}
        with:
          bun-version-file: .bun-version
      - if: ${{ !cancelled() }}
        run: just bun-advisories-check
