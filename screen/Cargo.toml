[workspace]
members = ["crates/helper", "crates/screen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.100.0"
version = "0.1.0"

[workspace.lints.rust]
dead_code = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
redundant_pub_crate = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"

[workspace.dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
screen = { path = "crates/screen", default-features = false }
stream = { path = "../stream/crates/stream" }
stream-encode = { path = "../stream/crates/encode" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[profile.dev.package."*"]
debug = false
