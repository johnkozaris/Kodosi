[package]
name = "screen-helper"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "kodosi-screen"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = { workspace = true }
block2 = "0.6.2"
bytes = { workspace = true }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6.5"
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "AXError", "AXUIElement", "AXValue", "HIServices", "libc"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSCursor", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGDirectDisplay", "CGDisplayConfiguration", "CGDisplayStream", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow", "libc"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSTimer", "block2"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "CSCommon", "SecBase", "SecCode", "SecRequirement"] }
screen = { workspace = true }
stream = { workspace = true }
stream-encode = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
fast_image_resize = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
pipewire = "0.10.1"
png = { workspace = true }
reis = { version = "0.7.1", features = ["tokio"] }
rustix = { version = "1.1.2", features = ["time"] }
screen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stream = { workspace = true }
stream-encode = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std"] }
xkbcommon-dl = "0.4.2"
xkeysym = "0.2.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
fast_image_resize = { workspace = true }
png = { workspace = true }
screen = { workspace = true }
stream = { workspace = true }
stream-encode = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
