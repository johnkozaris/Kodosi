[workspace]
members = [
  "crates/agent-intel",
  "crates/ghostty-vt",
  "crates/ghostty-vt-sys",
  "crates/kodosi-backend-client",
  "crates/kodosi-domain",
  "crates/kodosi-ffi-c",
  "crates/kodosi-pty",
  "crates/kodosi-session",
  "crates/kodosi-utils",
]
resolver = "3"

[workspace.lints.rust]
dead_code = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_safety_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "allow"
unwrap_used = "warn"






redundant_pub_crate = "allow"



must_use_candidate = "allow"




missing_const_for_fn = "allow"

[workspace.dependencies]
arc-swap = "1.9.2"
aws-lc-rs = "1.18"

base64 = { version = "0.23", default-features = false, features = ["std"] }
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
jsonc-parser = { version = "0.33.1", default-features = false, features = [
  "cst",
  "serde",
  "serde_json",
] }
notify = { version = "8.2.0", default-features = false, features = [
  "macos_fsevent",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
  "stream",
] }
rustix = "1.1.4"
serde = "1.0.229"
serde_json = "1.0.151"
specta = "=2.0.0-rc.25"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0"
time = "0.3.55"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-native-roots",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.25", features = ["serde", "v7"] }
zeroize = "1.9.0"

[package]
autobins = false
edition = "2024"
name = "kodosi-runtime"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[lib]
crate-type = ["lib"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:crossterm", "dep:indicatif"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
agent-intel = { path = "crates/agent-intel" }
ghostty-vt = { path = "crates/ghostty-vt" }
kodosi-backend-client = { path = "crates/kodosi-backend-client" }
kodosi-domain = { path = "crates/kodosi-domain" }
kodosi-session = { path = "crates/kodosi-session" }

futures-util = { workspace = true }
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "rt"] }

aws-lc-rs = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6", features = ["derive"], optional = true }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
directories = { version = "6.0.0", default-features = false }
indicatif = { version = "0.18.6", optional = true }

base64 = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
tempfile = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
uuid = { workspace = true }

console-subscriber = { version = "0.5.0", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
crossterm = { version = "0.29.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
axum = { version = "0.8.9", features = ["json"] }
insta = { version = "1.48.0", default-features = false, features = ["json"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }


tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[profile.dev]


debug = "line-tables-only"
split-debuginfo = "off"

[profile.ffi-debug]

inherits = "dev"
incremental = false
split-debuginfo = "packed"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "unwind"
strip = "symbols"



[profile.dev.package."*"]
debug = false
opt-level = 1

[[bin]]
name = "kodosi"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "protocol-gen"
path = "src/protocol_gen.rs"
