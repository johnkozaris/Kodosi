





log_filter = "info,kodosi_runtime=debug"

[runtime]
session_prefix = "kodosi"
tick_interval_ms = 120

[backend]
api = "https://api.kodosi.com"
host_relay = "wss://api.kodosi.com"
user_events = "wss://api.kodosi.com"
viewer_relay = "wss://api.kodosi.com"

[permissions]



allow_terminal_clipboard_write = false
decision_timeout_secs = 120

[auth]
client_id = "kodosi-app"
issuer = "https://auth.kodosi.com/application/o/kodosi/"
keyring_service = "com.kodosi.local"
refresh_skew_minutes = 5
scope = "openid profile email offline_access"
