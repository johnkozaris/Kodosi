language = "C"
pragma_once = true
cpp_compat = true
include_guard = "KODOSI_RUNTIME_H"
header = """
/* Generated by cbindgen. DO NOT edit by hand.
 *
 * Regenerate via:
 *   cargo build --release -p kodosi-ffi-c
 *
 * The build script writes this header to:
 *   target/include/kodosi_runtime.h
 */"""

[export]
prefix = ""
include = []

[export.rename]
"KodosiCallbacks" = "kodosi_callbacks_v2_t"
"EventCb" = "kodosi_event_cb_t"
"TerminalDataV2Cb" = "kodosi_terminal_data_v2_cb_t"
"TerminalControlV2Cb" = "kodosi_terminal_control_v2_cb_t"
"TerminalConnectResultV2Cb" = "kodosi_terminal_connect_result_v2_cb_t"
"TerminalSemanticCheckpointV2Cb" = "kodosi_terminal_semantic_checkpoint_v2_cb_t"

[parse]
parse_deps = false
include = []

[fn]
prefix = ""
postfix = ""
sort_by = "None"
