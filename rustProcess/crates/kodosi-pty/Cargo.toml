[package]
name = "kodosi-pty"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
kodosi-utils = { path = "../kodosi-utils" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
