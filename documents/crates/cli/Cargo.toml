[package]
edition.workspace = true
license.workspace = true
name = "documents-cli"
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "documents"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
document = { workspace = true }
documents = { workspace = true }
docx = { workspace = true }
getrandom = "0.4.3"
pdf = { workspace = true }
plain = { workspace = true }
pptx = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
xlsx = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
