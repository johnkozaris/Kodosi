[workspace]
members = ["crates/cli", "crates/document", "crates/documents", "crates/docx", "crates/package", "crates/pdf", "crates/plain", "crates/pptx", "crates/text", "crates/xlsx"]
exclude = ["app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99.1"
version = "0.1.0"

[workspace.lints.rust]
dead_code = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
redundant_pub_crate = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"

[workspace.dependencies]
document = { path = "crates/document" }
documents = { path = "crates/documents" }
docx = { path = "crates/docx" }
flate2 = "1.1.10"
package = { path = "crates/package" }
pdf = { path = "crates/pdf" }
plain = { path = "crates/plain" }
pptx = { path = "crates/pptx" }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
text = { path = "crates/text" }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
xlsx = { path = "crates/xlsx" }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
