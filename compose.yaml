name: kodosi-local

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: kodosi
      POSTGRES_USER: kodosi
      POSTGRES_PASSWORD: kodosi-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodosi -d kodosi"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - kodosi-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: dotnetBackend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Kodosi: Host=postgres;Port=5432;Database=kodosi;Username=kodosi;Password=kodosi-local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    ports:
      - "127.0.0.1:5180:8080"
    restart: unless-stopped
    volumes:
      - kodosi-data-protection:/home/app/.aspnet/DataProtection-Keys

volumes:
  kodosi-postgres:
  kodosi-data-protection:
