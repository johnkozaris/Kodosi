name: kodosi-local

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: kodosi
      POSTGRES_USER: kodosi
      POSTGRES_PASSWORD: kodosi-local
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kodosi", "-d", "kodosi"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 1m
      start_interval: 1s
    stop_grace_period: 1m
    restart: unless-stopped
    volumes:
      - kodosi-postgres:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Kodosi: Host=postgres;Port=5432;Database=kodosi;Username=kodosi;Password=kodosi-local

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Kodosi: Host=postgres;Port=5432;Database=kodosi;Username=kodosi;Password=kodosi-local
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 1s
    ports:
      - "127.0.0.1:5180:8080"
    restart: unless-stopped

volumes:
  kodosi-postgres:
    external: true
    name: ${KODOSI_POSTGRES_VOLUME:?Select an existing inspected PostgreSQL volume explicitly}
