name: kodosi-local

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: kodosi
      POSTGRES_USER: kodosi
      POSTGRES_PASSWORD: kodosi-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodosi -d kodosi"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - kodosi-postgres:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Kodosi: Host=postgres;Port=5432;Database=kodosi;Username=kodosi;Password=kodosi-local

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Kodosi: Host=postgres;Port=5432;Database=kodosi;Username=kodosi;Password=kodosi-local
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/health/ready",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    ports:
      - "127.0.0.1:5180:8080"
    restart: unless-stopped

volumes:
  kodosi-postgres:
    external: true
    name: ${KODOSI_POSTGRES_VOLUME:?Select an existing inspected PostgreSQL volume explicitly}
